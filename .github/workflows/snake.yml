name: snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github&color_snake=#ff4f00&color_dots=#e6e3dc,#ffd9c7,#ffad85,#ff7a3d,#ff4f00
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff5c1f&color_dots=#1a1a18,#4a2414,#7d3515,#c04a16,#ff5c1f
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
